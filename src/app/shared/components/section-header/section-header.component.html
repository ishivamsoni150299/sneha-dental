<header [class]="centered() ? 'mx-auto max-w-3xl text-center' : 'max-w-3xl'">
  @if (label()) { <p class="ui-eyebrow" [class.justify-center]="centered()">{{ label() }}</p> }
  <h2 class="ui-heading">{{ title() }}</h2>
  @if (subtitle()) { <p class="ui-lede" [class.mx-auto]="centered()">{{ subtitle() }}</p> }
</header>
