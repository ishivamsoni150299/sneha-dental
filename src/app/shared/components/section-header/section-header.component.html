<div [class]="centered() ? 'text-center' : ''">
  @if (label()) {
    <span class="ds-kicker mb-4">
      <span class="ds-kicker-dot"></span>
      {{ label() }}
    </span>
  }
  <h2 class="ds-heading mb-3">{{ title() }}</h2>
  @if (subtitle()) {
    <p [class]="centered() ? 'ds-copy max-w-xl mx-auto' : 'ds-copy max-w-xl'">
      {{ subtitle() }}
    </p>
  }
</div>
