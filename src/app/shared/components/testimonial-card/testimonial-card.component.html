<article class="ui-card ui-card-interactive group flex h-full flex-col">
  <div class="mb-5 flex items-center justify-between gap-3">
    <div class="flex gap-0.5" [attr.aria-label]="rating() + ' out of 5 stars'">
      @for (star of [1, 2, 3, 4, 5]; track star) {
        <svg [class]="star <= rating() ? 'h-4 w-4 text-amber-500' : 'h-4 w-4 text-ui-line-strong'" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
        </svg>
      }
    </div>
    <span class="ui-badge ui-badge-success">
      <svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
      Verified patient
    </span>
  </div>
  <blockquote class="flex-1 font-display text-xl leading-relaxed text-ui-ink">“{{ review() }}”</blockquote>
  <footer class="mt-6 flex items-center gap-3 border-t border-ui-line pt-4">
    <span class="grid h-10 w-10 shrink-0 place-items-center rounded-full bg-[var(--ui-primary)] text-sm font-bold text-white">{{ name().charAt(0) }}</span>
    <span class="min-w-0">
      <span class="block truncate text-sm font-bold text-ui-ink">{{ name() }}</span>
      @if (location()) { <span class="ui-caption block truncate">{{ location() }}</span> }
    </span>
  </footer>
</article>
