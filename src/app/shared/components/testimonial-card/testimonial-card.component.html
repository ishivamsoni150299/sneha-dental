<article class="clinic-review-card">
  <div class="clinic-review-card-head">
    <div class="clinic-review-card-stars" [attr.aria-label]="rating() + ' out of 5 stars'">
      @for (star of [1, 2, 3, 4, 5]; track star) {
        <svg [class.clinic-review-card-star-muted]="star > rating()" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
        </svg>
      }
    </div>
    <span>Verified</span>
  </div>
  <blockquote>&ldquo;{{ review() }}&rdquo;</blockquote>
  <footer>
    <span class="clinic-review-card-avatar">{{ name().charAt(0) }}</span>
    <span>
      <strong>{{ name() }}</strong>
      @if (location()) { <small>{{ location() }}</small> }
    </span>
  </footer>
</article>
