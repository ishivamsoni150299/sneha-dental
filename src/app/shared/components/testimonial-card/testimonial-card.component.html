<article class="ds-card group relative flex h-full flex-col overflow-hidden hover:-translate-y-1">
  <div class="absolute inset-x-0 top-0 h-0.5 bg-brand opacity-0 transition-opacity duration-300 group-hover:opacity-100"></div>

  <div class="relative mb-4 flex gap-0.5">
    @for (star of [1,2,3,4,5]; track star) {
      <svg
        [class]="star <= rating()
          ? 'h-4 w-4 text-yellow-400 transition-transform duration-200 group-hover:scale-110'
          : 'h-4 w-4 text-app-line-strong transition-transform duration-200'"
        fill="currentColor"
        viewBox="0 0 20 20"
        aria-hidden="true">
        <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
      </svg>
    }
  </div>

  <p class="relative mb-5 line-clamp-5 flex-1 text-sm italic leading-relaxed text-app-text-soft transition-colors duration-200 group-hover:text-app-text">
    "{{ review() }}"
  </p>

  <div class="mt-auto flex items-center gap-3 border-t border-app-line pt-4">
    <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-brand text-sm font-bold text-white shadow-sm transition-all duration-200 group-hover:scale-105">
      {{ name().charAt(0) }}
    </div>

    <div class="min-w-0 flex-1">
      <p class="truncate text-sm font-bold text-app-text">{{ name() }}</p>
      @if (location()) {
        <p class="ds-small truncate">{{ location() }}</p>
      }
    </div>

    <div class="flex shrink-0 items-center gap-1 rounded-full border border-status-success bg-status-success-soft px-2 py-1 text-[10px] font-bold text-status-success">
      <svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
      </svg>
      Verified
    </div>
  </div>
</article>
