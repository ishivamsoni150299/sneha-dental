<article class="ui-card ui-card-interactive group flex h-full flex-col">
  <div class="mb-5 flex items-start justify-between gap-4">
    <div class="grid h-12 w-12 shrink-0 place-items-center rounded-[var(--ui-radius-md)] border border-[var(--ui-primary-line)] bg-[var(--ui-primary-soft)] text-[var(--ui-primary)] transition-transform duration-200 group-hover:scale-105">
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="iconPath()"/>
      </svg>
    </div>
    @if (price() && !compact()) { <span class="ui-badge ui-badge-primary">{{ price() }}</span> }
  </div>

  <div class="flex flex-1 flex-col">
    <h3 class="ui-title text-base">{{ name() }}</h3>
    @if (description() && !compact()) { <p class="ui-body mt-2 flex-1">{{ description() }}</p> }
    @if (benefit() && !compact()) {
      <p class="mt-4 flex items-start gap-2 text-xs font-semibold leading-relaxed text-[var(--ui-primary-hover)]">
        <svg class="mt-0.5 h-3.5 w-3.5 shrink-0 text-status-success" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
        </svg>
        <span>{{ benefit() }}</span>
      </p>
    }
    <a [routerLink]="['/appointment']" [queryParams]="{ service: name() }" class="ui-btn ui-btn-secondary ui-btn-block mt-5">
      <svg class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
      </svg>
      Book this treatment
    </a>
  </div>
</article>
