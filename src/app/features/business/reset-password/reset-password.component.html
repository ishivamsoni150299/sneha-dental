<div class="platform-auth-shell">
  <header class="platform-auth-topbar">
    <div class="ui-container flex h-16 items-center justify-between gap-4">
      <a routerLink="/business" class="flex items-center gap-2.5" aria-label="mydentalplatform home">
        <img src="/assets/brand/mydentalplatform-logo.svg" class="h-9 w-9" alt="">
        <span class="text-sm font-bold">mydental<span class="text-ui-primary">platform</span></span>
      </a>
      <a routerLink="/business/login" class="ui-btn ui-btn-secondary ui-btn-sm">Back to sign in</a>
    </div>
  </header>

  <main id="main-content" class="ui-container-reading flex min-h-[calc(100vh-4rem)] items-center py-12">
    <section class="mx-auto w-full max-w-md">
      @if (completed()) {
        <div class="ui-alert ui-alert-success" role="status" aria-live="polite">
          <span class="ui-status-dot mt-1" aria-hidden="true"></span>
          <div>
            <h1 class="ui-title">Password updated</h1>
            <p class="ui-body mt-2 text-sm">Your existing sessions were signed out. Use your new password to continue.</p>
          </div>
        </div>
        <a routerLink="/business/login" class="ui-btn ui-btn-primary ui-btn-block mt-6">Sign in</a>
      } @else {
        <p class="ui-eyebrow">Account recovery</p>
        <h1 class="ui-heading mt-3">Choose a new password</h1>
        <p class="ui-body mt-2">Use at least 8 characters.</p>

        @if (error()) {
          <div class="ui-alert ui-alert-danger mt-6" role="alert">
            <span class="ui-status-dot mt-1" aria-hidden="true"></span>
            <p class="text-sm font-semibold">{{ error() }}</p>
          </div>
        }

        <form [formGroup]="form" class="mt-7 space-y-4" (ngSubmit)="submit()">
          <div>
            <label for="new-password" class="ui-label">New password</label>
            <input id="new-password" formControlName="password" type="password" autocomplete="new-password"
              class="ui-field" [attr.aria-invalid]="form.controls.password.invalid && form.controls.password.touched">
          </div>
          <div>
            <label for="confirm-password" class="ui-label">Confirm password</label>
            <input id="confirm-password" formControlName="confirmation" type="password" autocomplete="new-password"
              class="ui-field" [attr.aria-invalid]="form.controls.confirmation.invalid && form.controls.confirmation.touched">
          </div>
          <button type="submit" class="ui-btn ui-btn-primary ui-btn-block" [disabled]="submitting()">
            {{ submitting() ? 'Updating password...' : 'Update password' }}
          </button>
        </form>
      }
    </section>
  </main>
</div>
