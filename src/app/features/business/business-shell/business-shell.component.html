<div class="platform-shell platform-admin-shell flex flex-col">
  <header class="ui-topbar platform-admin-topbar">
    <div class="ui-container flex h-16 items-center justify-between gap-4">
      <a routerLink="/business/clinics" class="flex min-w-0 items-center gap-2.5" aria-label="mydentalplatform admin home">
        <img src="/assets/brand/mydentalplatform-logo.svg" class="h-9 w-9 shrink-0" alt="">
        <span class="truncate text-sm font-bold tracking-[-0.025em] text-ui-ink">
          mydental<span class="text-ui-primary">platform</span>
        </span>
        <span class="ui-badge hidden sm:inline-flex">Admin</span>
      </a>

      <nav class="hidden items-center gap-0.5 sm:flex" aria-label="Platform administration">
        <a routerLink="/business/clinics" routerLinkActive="ui-nav-link-active" class="ui-nav-link">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5"/></svg>
          Clinics
          @if (clinicCount() !== null) { <span class="ui-badge ml-0.5">{{ clinicCount() }}</span> }
        </a>
        <a routerLink="/business/analytics" routerLinkActive="ui-nav-link-active" class="ui-nav-link">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M4 19V9m6 10V5m6 14v-7m4 7H2"/></svg>
          Analytics
        </a>
        <a routerLink="/business/leads" routerLinkActive="ui-nav-link-active" class="ui-nav-link">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20H7m10 0v-2a5 5 0 00-10 0v2m8-13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          Leads
        </a>
        <a routerLink="/business/revenue" routerLinkActive="ui-nav-link-active" class="ui-nav-link">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8v8m0 0v2m9-5a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          Revenue
        </a>
        <span class="mx-2 h-7 w-px bg-ui-line" aria-hidden="true"></span>
        <span class="hidden max-w-[150px] truncate text-xs text-ui-ink-muted lg:block">{{ auth.currentUser()?.email }}</span>
        <button type="button" (click)="logout()" class="ui-btn ui-btn-ghost ui-btn-sm">Sign out</button>
      </nav>

      <button type="button" (click)="logout()" class="ui-btn ui-btn-ghost ui-btn-icon sm:hidden" aria-label="Sign out">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
      </button>
    </div>
  </header>

  <main id="main-content" class="ui-container flex-1 py-6 pb-24 sm:py-8 sm:pb-8">
    <router-outlet />
  </main>

  <nav class="platform-mobile-nav sm:hidden" aria-label="Platform administration">
    <div class="grid h-16 grid-cols-4">
      <a routerLink="/business/clinics" routerLinkActive #clinicRoute="routerLinkActive" class="ui-nav-link flex-col justify-center gap-1 rounded-none" [class.ui-nav-link-active]="clinicRoute.isActive">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0H5"/></svg>
        <span class="text-[10px]">Clinics</span>
      </a>
      <a routerLink="/business/analytics" routerLinkActive #analyticsRoute="routerLinkActive" class="ui-nav-link flex-col justify-center gap-1 rounded-none" [class.ui-nav-link-active]="analyticsRoute.isActive">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M4 19V9m6 10V5m6 14v-7m4 7H2"/></svg>
        <span class="text-[10px]">Analytics</span>
      </a>
      <a routerLink="/business/leads" routerLinkActive #leadsRoute="routerLinkActive" class="ui-nav-link flex-col justify-center gap-1 rounded-none" [class.ui-nav-link-active]="leadsRoute.isActive">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20H7m10 0v-2a5 5 0 00-10 0v2m8-13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        <span class="text-[10px]">Leads</span>
      </a>
      <a routerLink="/business/revenue" routerLinkActive #revenueRoute="routerLinkActive" class="ui-nav-link flex-col justify-center gap-1 rounded-none" [class.ui-nav-link-active]="revenueRoute.isActive">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8v10m9-5a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span class="text-[10px]">Revenue</span>
      </a>
    </div>
  </nav>
</div>
