<div class="marketplace-shell">
  <a href="#marketplace-content" class="sr-only focus:not-sr-only">Skip to content</a>
  <header class="marketplace-header">
    <a class="wordmark" routerLink="/dentists" aria-label="mydentalplatform patient home">
      <app-platform-brand size="lg" />
    </a>
    <details #professionalMenu class="professional-menu" (keydown.escape)="professionalMenu.open = false">
      <summary>For clinics <i class="ph ph-caret-down" aria-hidden="true"></i></summary>
      <div><a routerLink="/professional" (click)="professionalMenu.open = false">For dentists <i class="ph ph-arrow-up-right" aria-hidden="true"></i></a><a routerLink="/business" (click)="professionalMenu.open = false">For clinic owners <i class="ph ph-arrow-up-right" aria-hidden="true"></i></a></div>
    </details>
    <nav class="patient-navigation" aria-label="Patient navigation">
      <a routerLink="/dentists" routerLinkActive="active" ariaCurrentWhenActive="page"><i class="ph ph-magnifying-glass" aria-hidden="true"></i>Find a dentist</a>
      <a routerLink="/appointments" routerLinkActive="active" ariaCurrentWhenActive="page"><i class="ph ph-calendar-blank" aria-hidden="true"></i>My appointments</a>
      <a routerLink="/professional" class="clinic-nav">For dentists</a>
      <a routerLink="/business" class="clinic-nav">For clinics</a>
    </nav>
  </header>
  <main id="marketplace-content"><router-outlet /></main>
  <nav class="patient-tab-bar" aria-label="Mobile patient navigation">
    <a routerLink="/dentists" routerLinkActive="active" ariaCurrentWhenActive="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5" stroke-linecap="round"/></svg>
      <span>Book Appointment</span>
    </a>
    <a routerLink="/appointments" routerLinkActive="active" ariaCurrentWhenActive="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4m8-4v4M4 11h16m-12 5h3" stroke-linecap="round"/></svg>
      <span>My appointments</span>
    </a>
  </nav>
  <footer>
    <div class="footer-brand"><a routerLink="/dentists" aria-label="mydentalplatform patient home"><app-platform-brand size="sm" /></a><p>Good dental care starts with a confident choice.</p><span>Connecting patients with verified dentists in Delhi NCR.</span></div>
    <nav aria-label="Footer"><a routerLink="/business/privacy">Privacy</a><a routerLink="/business/terms">Terms</a><a routerLink="/professional">For dentists</a><a routerLink="/business">For clinics</a></nav>
  </footer>
</div>
