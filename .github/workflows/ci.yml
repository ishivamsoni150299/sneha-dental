name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Marketplace verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install dependencies
        run: npm ci

      - name: Verify frontend, backend and PostgreSQL journeys
        run: npm run verify

  browser-e2e:
    name: Browser journeys against disposable PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: '5432'
      DATABASE_NAME: postgres
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      JDBC_DATABASE_URL: jdbc:postgresql://localhost:5432/postgres
      SPRING_PROFILES_ACTIVE: production
      JWT_SECRET: browser-e2e-only-secret-with-at-least-32-bytes
      JWT_ISSUER: http://localhost:8080
      PUBLIC_BASE_URL: http://localhost:4200
      E2E_ISOLATED_DB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Provision isolated database roles
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto'
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c 'CREATE ROLE anon NOLOGIN'
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c 'CREATE ROLE authenticated NOLOGIN'
      - name: Start API and Angular
        run: |
          (cd backend && ./mvnw -B spring-boot:run > ../backend-e2e.log 2>&1) &
          npm start -- --host 127.0.0.1 > frontend-e2e.log 2>&1 &
      - name: Run Playwright browser journeys
        run: npm run test:e2e
      - name: Show startup logs on failure
        if: failure()
        run: |
          tail -n 100 backend-e2e.log || true
          tail -n 100 frontend-e2e.log || true
