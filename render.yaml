services:
  - type: web
    name: mydentalplatform
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: JDBC_DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_ISSUER
        value: https://mydentalplatform.com
      - key: JWT_SECRET
        generateValue: true
      - key: SECURE_COOKIES
        value: "true"
      - key: PUBLIC_BASE_URL
        value: https://mydentalplatform.com
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SPRING_PROFILES_ACTIVE
        value: production
