spring:
  application:
    name: mydentalplatform
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:mydentalplatform}}
    username: ${DATABASE_USERNAME:mydentalplatform}
    password: ${DATABASE_PASSWORD:mydentalplatform}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:8}
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

platform:
  auth:
    issuer: ${JWT_ISSUER:http://localhost:8080}
    secret: ${JWT_SECRET:bXlkZW50YWxwbGF0Zm9ybS1sb2NhbC1kZXZlbG9wbWVudC1vbmx5LXNlY3JldA==}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P7D}
    secure-cookies: ${SECURE_COOKIES:false}
  billing:
    razorpay-key-id: ${RAZORPAY_KEY_ID:}
    razorpay-key-secret: ${RAZORPAY_KEY_SECRET:}
    razorpay-webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    starter-plan-id: ${RAZORPAY_PLAN_STARTER_MONTHLY:plan_ShGxRJzXZynEts}
    pro-plan-id: ${RAZORPAY_PLAN_PRO_MONTHLY:plan_ShGumDVvGT5kJz}
    manual-payment-url: ${PUBLIC_RAZORPAY_ME_URL:}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    correlation: "[%X{traceId:-}] "