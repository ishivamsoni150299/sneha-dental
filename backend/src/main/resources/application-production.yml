spring:
  datasource:
    url: ${JDBC_DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      connection-init-sql: SET search_path TO dental, public, extensions
  flyway:
    default-schema: dental
    schemas: dental
    # Render instances can encounter a transient Supavisor connection reset
    # while the database is waking up. Retry the startup connection without
    # weakening TLS validation or hiding persistent configuration errors.
    connect-retries: 6
    connect-retries-interval: 5

platform:
  public-base-url: ${PUBLIC_BASE_URL:${RENDER_EXTERNAL_URL}}
  auth:
    issuer: ${JWT_ISSUER:${PUBLIC_BASE_URL:${RENDER_EXTERNAL_URL}}}
    secret: ${JWT_SECRET}
    secure-cookies: true

server:
  tomcat:
    threads:
      max: 30
      min-spare: 2
